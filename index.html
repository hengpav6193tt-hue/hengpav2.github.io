<!DOCTYPE html>
<html>
<head>
    <title>TikTok Like Tool</title>
    <style>
        body {
            background: black;
            color: white;
            text-align: center;
            font-family: Arial;
        }
        input {
            padding: 10px;
            width: 300px;
            border-radius: 5px;
            border: none;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
            background: red;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<h1>🔥 TikTok Like Tool</h1>

<p>Paste your TikTok video link 👇</p>

<input type="text" id="link" placeholder="Paste TikTok URL here">

<br>

<button onclick="goToVideo()">❤️ Like Now</button>

<p id="status"></p>

<script>
function goToVideo() {
    let link = document.getElementById("link").value;
    let status = document.getElementById("status");

    if (link === "") {
        status.innerHTML = "❌ Please paste a link first!";
        return;
    }

    status.innerHTML = "Opening TikTok... 🚀";

    // Open TikTok video in new tab
    window.open(link, "_blank");
}
</script>

</body>
</html>
